name: Build TOKI Installer

# Builds toki-installer-branch/installer.iss into a TOKI-Setup-*.exe on a
# Windows runner (Inno Setup is Windows-only). Doesn't need `main` checked
# out -- the installer itself downloads app source from `main` at install
# time, same as a local build per BUILD_INSTRUCTIONS.md.

on:
  push:
    branches: [installer]
    paths:
      - "toki-installer-branch/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the built installer to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout installer branch
        uses: actions/checkout@v5
        with:
          ref: installer

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Read MyAppVersion from installer.iss
        id: ver
        shell: pwsh
        run: |
          $content = Get-Content "toki-installer-branch\installer.iss" -Raw
          if ($content -match '#define MyAppVersion "([^"]+)"') {
            $version = $matches[1]
          } else {
            $version = "unknown"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Compile installer.iss
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "toki-installer-branch\installer.iss"

      - name: Locate compiled installer
        id: out
        shell: pwsh
        run: |
          # OutputBaseFilename is TOKI-Setup-{version}-build{run number}, not a
          # fixed name, so it always matches whatever installer.iss actually
          # produced this run instead of assuming a hardcoded filename.
          $exe = Get-ChildItem -Path "toki-installer-branch\dist" -Filter "TOKI-Setup-*.exe" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "No TOKI-Setup-*.exe found in toki-installer-branch\dist -- check the ISCC log above."
            exit 1
          }
          echo "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.out.outputs.name }}
          path: ${{ steps.out.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TOKI v${{ steps.ver.outputs.version }}
          files: ${{ steps.out.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
